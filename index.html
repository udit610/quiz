<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Saturday Quiz — Vardhman Convent School, Moonak</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --board:#0B1F4D;
    --board-2:#122a5e;
    --chalk:#F5F1E6;
    --paper:#FBF8F0;
    --line:#D8CFB8;
    --mustard:#E8A33D;
    --red:#C1443C;
    --blue:#0B1F4D;
    --sage:#2E7D46;
    --ink:#2B2620;
  }

  *{
    box-sizing:border-box;
  }

  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    background:var(--board);
    background-image:
      radial-gradient(circle at 20% 20%,rgba(255,255,255,0.03) 0%,transparent 40%),
      radial-gradient(circle at 80% 70%,rgba(255,255,255,0.025) 0%,transparent 40%);
    color:var(--ink);
    min-height:100vh;
  }

  .theme-badge{
    display:inline-block;
    background:var(--mustard);
    color:var(--board);
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:.8rem;
    padding:4px 14px;
    border-radius:20px;
    letter-spacing:.03em;
    margin-top:8px;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:32px 18px 60px;
  }

  header{
    text-align:center;
    margin-bottom:26px;
  }

  header .chalk-line{
    width:64px;
    height:3px;
    background:var(--mustard);
    margin:0 auto 14px;
    border-radius:2px;
    opacity:.8;
  }

  h1{
    font-family:'Kalam',cursive;
    color:var(--chalk);
    font-size:2.1rem;
    margin:0 0 6px;
    letter-spacing:.5px;
  }

  header .school-name{
    color:var(--chalk);
    margin:0 0 10px;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:.02em;
  }

  header .school-phone{
    color:var(--sage);
    margin:-6px 0 10px;
    font-size:.9rem;
    font-weight:700;
    letter-spacing:.02em;
  }

  header p{
    color:var(--sage);
    margin:0;
    font-size:.95rem;
    font-weight:600;
  }

  .card{
    background:var(--paper);
    border-radius:14px;
    padding:26px 24px;
    box-shadow:0 14px 34px rgba(0,0,0,.28);
    border-top:3px solid var(--mustard);
  }

  .field{
    margin-bottom:18px;
  }

  label{
    display:block;
    font-weight:800;
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--board);
    margin-bottom:8px;
  }

  input[type="text"]{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:2px solid var(--line);
    font-family:'Nunito',sans-serif;
    font-size:1rem;
    background:#fff;
    color:var(--ink);
  }

  input[type="text"]:focus{
    outline:none;
    border-color:var(--blue);
  }

  .custom-select{
    position:relative;
  }

  .custom-select-trigger{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    border-radius:9px;
    border:2px solid var(--board);
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:1rem;
    background:var(--paper);
    color:var(--board);
    cursor:pointer;
    text-align:left;
  }

  .custom-select-trigger:focus{
    outline:none;
    border-color:var(--blue);
  }

  .custom-select-trigger .chevron{
    flex-shrink:0;
    margin-left:10px;
    transition:transform .15s ease;
  }

  .custom-select.open .custom-select-trigger .chevron{
    transform:rotate(180deg);
  }

  .custom-select-options{
    list-style:none;
    margin:6px 0 0;
    padding:6px;
    position:absolute;
    top:100%;
    left:0;
    right:0;
    z-index:20;
    background:var(--paper);
    border:2px solid var(--board);
    border-radius:11px;
    box-shadow:0 12px 26px rgba(0,0,0,.22);
    max-height:260px;
    overflow-y:auto;
  }

  .custom-select-options li{
    padding:11px 12px;
    border-radius:7px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
  }

  .custom-select-options li:hover,
  .custom-select-options li.active{
    background:var(--mustard);
    color:var(--board);
  }

  .custom-select-options li.selected{
    color:var(--blue);
  }

  .custom-select-options li.selected::after{
    content:"✓";
    float:right;
    font-weight:800;
  }

  .btn{
    display:inline-block;
    background:var(--board);
    color:var(--chalk);
    font-family:'Kalam',cursive;
    font-size:1.15rem;
    border:none;
    padding:13px 28px;
    border-radius:9px;
    cursor:pointer;
    box-shadow:0 6px 0 #071433;
    transition:transform .08s ease;
  }

  .btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #071433;
  }

  .btn:disabled{
    opacity:.45;
    cursor:not-allowed;
    box-shadow:0 6px 0 #071433;
  }

  .btn-row{
    text-align:center;
    margin-top:22px;
  }

  .btn.secondary{
    background:var(--paper);
    color:var(--board);
    border:2px solid var(--board);
    box-shadow:none;
  }

  .quiz-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    padding-bottom:12px;
    border-bottom:2px dashed var(--line);
    flex-wrap:wrap;
    gap:8px;
  }

  .quiz-header .who{
    font-weight:800;
    color:var(--board);
  }

  .quiz-header .prog{
    font-size:.85rem;
    color:#7a7362;
    font-weight:700;
  }

  .timer-wrap{
    height:8px;
    width:100%;
    background:var(--line);
    border-radius:6px;
    overflow:hidden;
    margin:0 0 18px;
  }

  .timer-bar{
    height:100%;
    width:100%;
    background:var(--sage);
    transition:width 1s linear,background-color .3s;
  }

  .timer-bar.urgent{
    background:var(--red);
  }

  #questionsContainer{
    user-select:none;
    -webkit-user-select:none;
  }

  .q-block{
    padding:16px 0;
    border-bottom:1px solid var(--line);
  }

  .q-block:last-of-type{
    border-bottom:none;
  }

  .q-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;
    height:26px;
    background:var(--mustard);
    color:var(--board);
    font-weight:800;
    border-radius:50%;
    font-size:.85rem;
    margin-right:8px;
  }

  .q-text{
    font-weight:700;
    font-size:1.02rem;
    display:inline;
  }

  .q-photo{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    max-height:260px;
    margin:0 0 14px;
    border-radius:12px;
    overflow:hidden;
    background:#E9E2D2;
    border:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .q-photo .photo-main{
    position:relative;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  /*
   A blurred copy of the same picture fills
   the corners, so tall photos (towers and
   statues) are shown whole instead of being
   cropped.
  */

  .q-photo .photo-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:blur(16px) brightness(.92);
    transform:scale(1.2);
  }

  .q-photo .photo-emoji{
    font-size:3.4rem;
    line-height:1;
  }

  .q-photo.is-loading::after{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(
      100deg,
      rgba(255,255,255,0) 20%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,0) 80%
    );
    background-size:220% 100%;
    animation:photoShimmer 1.1s linear infinite;
  }

  @keyframes photoShimmer{
    from{background-position:120% 0;}
    to{background-position:-120% 0;}
  }

  .review .q-photo{
    width:64px;
    height:64px;
    aspect-ratio:auto;
    max-height:none;
    float:left;
    margin:2px 12px 6px 0;
    border-radius:10px;
  }

  .review .q-photo .photo-emoji{
    font-size:1.6rem;
  }

  .review .q-photo .photo-main{
    object-fit:cover;
  }

  .review .q-photo .photo-bg{
    display:none;
  }

  .review .q-block{
    overflow:hidden;
  }

  /*
   Puzzle card: shows the pattern, sequence or code
   itself, for weeks where the question is the picture.
  */

  .q-pic{
    margin:0 0 14px;
    padding:22px 16px;
    min-height:120px;
    border-radius:12px;
    border:2px solid var(--line);
    background:
      linear-gradient(
        180deg,
        #FFF7E6,
        #FBEFD6
      );
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    white-space:pre-wrap;
    font-weight:800;
    font-size:1.65rem;
    line-height:1.5;
    letter-spacing:.02em;
    color:var(--board);
    overflow-wrap:anywhere;
  }

  .q-pic span{
    display:inline-block;
    max-width:100%;
  }

  .review .pic-line{
    clear:none;
    margin:6px 0 2px;
    font-weight:700;
    font-size:.9rem;
    color:#7a7362;
    white-space:pre-line;
  }

  .photo-credit{
    text-align:center;
    color:rgba(245,241,230,.45);
    font-size:.72rem;
    margin-top:18px;
    line-height:1.5;
  }

  .options{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    border:2px solid var(--line);
    cursor:pointer;
    transition:border-color .12s,background .12s;
  }

  /*
   Options are <label>s, so undo the uppercase heading
   style that the general label rule gives them.
  */

  .opt{
    text-transform:none;
    letter-spacing:normal;
  }

  .opt:hover{
    border-color:var(--blue);
  }

  .opt input{
    accent-color:var(--board);
    width:16px;
    height:16px;
  }

  .opt.selected{
    border-color:var(--blue);
    background:#EEF3F8;
  }

  .opt-text{
    font-weight:600;
    font-size:.96rem;
  }

  .warn{
    color:var(--red);
    font-weight:700;
    font-size:.85rem;
    text-align:center;
    margin-top:10px;
    display:none;
  }

  .results{
    text-align:center;
  }

  .stamp{
    width:150px;
    height:150px;
    margin:6px auto 18px;
    border-radius:50%;
    border:5px solid var(--red);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-6deg);
    color:var(--red);
    font-family:'Kalam',cursive;
  }

  .stamp .score-num{
    font-size:2.2rem;
    font-weight:700;
    line-height:1;
  }

  .stamp .score-label{
    font-size:.75rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-top:2px;
  }

  .result-msg{
    font-family:'Kalam',cursive;
    font-size:1.3rem;
    color:var(--board);
    margin-bottom:6px;
  }

  .result-sub{
    color:#7a7362;
    font-weight:600;
    margin-bottom:22px;
    font-size:.92rem;
  }

  .save-status{
    font-size:.82rem;
    font-weight:700;
    margin-bottom:22px;
  }

  .save-status.ok{
    color:#2E7D46;
  }

  .save-status.fail{
    color:var(--red);
  }

  .save-status.pending{
    color:#7a7362;
  }

  .review{
    text-align:left;
    margin-top:10px;
  }

  .review .q-block .your-ans,
  .review .q-block .correct-ans{
    font-size:.88rem;
    font-weight:700;
    margin-top:6px;
  }

  .review .correct .your-ans{
    color:#2E7D46;
  }

  .review .wrong .your-ans{
    color:var(--red);
  }

  .review .wrong .correct-ans{
    color:var(--blue);
  }

  .tag{
    display:inline-block;
    font-size:.7rem;
    font-weight:800;
    padding:2px 8px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
    text-transform:uppercase;
  }

  .tag.correct{
    background:#E1F3E5;
    color:#2E7D46;
  }

  .tag.wrong{
    background:#FBE4E2;
    color:var(--red);
  }

  .hidden{
    display:none;
  }

  footer{
    text-align:center;
    color:rgba(245,241,230,.5);
    font-size:.78rem;
    margin-top:26px;
  }

  @media (prefers-reduced-motion:reduce){
    .btn{
      transition:none;
    }
  }
</style>
</head>

<body>

<div class="wrap">

  <header>

    <p class="school-name">
      Vardhman Convent School, Moonak
    </p>

    <p class="school-phone">
      +91 9855458530
    </p>

    <div class="chalk-line"></div>

    <h1>
      The Great Saturday Quiz
    </h1>

    <p id="headerSub"></p>

    <div class="theme-badge">
      This Week: 🎈 Children's Day — 14 Nov
    </div>

  </header>


  <!-- SETUP -->

  <div class="card" id="setupCard">

    <div class="field">

      <label for="studentName">
        Student name
      </label>

      <input
        type="text"
        id="studentName"
        placeholder="Type your name"
        autocomplete="off"
      >

    </div>


    <div class="field">

      <label id="classLabelText">
        Select your class
      </label>

      <div class="custom-select" id="classDropdown">

        <button
          type="button"
          class="custom-select-trigger"
          id="classTrigger"
          aria-haspopup="listbox"
          aria-expanded="false"
        >

          <span id="classTriggerText">
            Choose a class
          </span>

          <svg
            class="chevron"
            width="14"
            height="9"
            viewBox="0 0 14 9"
          >
            <path
              d="M1 1L7 7L13 1"
              stroke="#0B1F4D"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

        </button>


        <ul
          class="custom-select-options hidden"
          id="classOptions"
          role="listbox"
        ></ul>

      </div>

    </div>


    <div class="warn" id="setupWarn">
      Please enter your name and pick a class.
    </div>


    <div class="btn-row">

      <button class="btn" id="startBtn">
        Start Quiz
      </button>

    </div>

  </div>


  <!-- QUIZ -->

  <div class="card hidden" id="quizCard">

    <div class="quiz-header">

      <div class="who" id="quizWho"></div>

      <div class="prog" id="quizProg"></div>

    </div>


    <div class="timer-wrap">

      <div
        class="timer-bar"
        id="timerBar"
      ></div>

    </div>


    <div id="questionsContainer"></div>


    <div class="warn" id="quizWarn">
      Please answer all questions before submitting.
    </div>


    <div class="btn-row">

      <button class="btn" id="submitBtn">
        Next Question
      </button>

    </div>

  </div>


  <!-- RESULTS -->

  <div class="card hidden" id="resultsCard">

    <div class="results">

      <div class="stamp">

        <div
          class="score-num"
          id="scoreNum"
        >
          0/10
        </div>

        <div class="score-label">
          Marks
        </div>

      </div>


      <div
        class="result-msg"
        id="resultMsg"
      ></div>


      <div
        class="result-sub"
        id="resultSub"
      ></div>


      <div
        class="save-status"
        id="saveStatus"
      ></div>

    </div>


    <div
      class="review"
      id="reviewContainer"
    ></div>


    <div class="btn-row">

      <button
        class="btn secondary"
        id="retryBtn"
      >
        Try Another Class
      </button>

    </div>

  </div>


  <p class="photo-credit" id="photoCredit">
    Photographs from Wikimedia Commons,
    used under their free licences.
  </p>

</div>


<script>

/* ============================================================
   GOOGLE APPS SCRIPT WEB APP
   ============================================================ */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyvoMi2k-7vsl3ZJfUQqozwC_tBUtQOYJFIq_KjrWoxtNLNBJTJNhd8mCHQjHAnDfkJ/exec";


/* ============================================================
   QUIZ QUESTIONS
   ============================================================ */

/*
   Each question shows either a photo (img, a key into
   QUESTION_IMAGES) or a puzzle card (pic, text drawn on
   the page). Weeks with no photos leave this map empty.
*/

const QUESTION_IMAGES = {

  "ball": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Children_play_joyfully_in_colorful_ball_pit_at_indoor_play_area_during_afternoon_fun.jpg/960px-Children_play_joyfully_in_colorful_ball_pit_at_indoor_play_area_during_afternoon_fun.jpg",

  "balloon": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Balloon_on_a_children%27s_birthday_party.jpg/960px-Balloon_on_a_children%27s_birthday_party.jpg",

  "cake": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Two_joyful_children_sit_on_a_mat_next_to_a_birthday_cake%2C_dressed_in_festive_hats.jpg/960px-Two_joyful_children_sit_on_a_mat_next_to_a_birthday_cake%2C_dressed_in_festive_hats.jpg",

  "storybook": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Children_reading_beneath_a_tree_-_Story-Friends_%281927%29_-_Mabel_Betsy_Hill.jpg/960px-Children_reading_beneath_a_tree_-_Story-Friends_%281927%29_-_Mabel_Betsy_Hill.jpg",

  "swing": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Playground_swing_01.jpg/960px-Playground_swing_01.jpg",

  "kite": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b8/Kite_flying_over_Pasing_04.jpg/960px-Kite_flying_over_Pasing_04.jpg",

  "butterfly": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Peacock_butterfly_%28Aglais_io%29_2.jpg/960px-Peacock_butterfly_%28Aglais_io%29_2.jpg",

  "dog": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/Two_puppies_playing_together_one_standing_over_the_other_at_golden_hour_in_Don_Det_Laos.jpg/960px-Two_puppies_playing_together_one_standing_over_the_other_at_golden_hour_in_Don_Det_Laos.jpg",

  "rainbow": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Rainbow_sky.jpg/960px-Rainbow_sky.jpg",

  "nehru": "https://upload.wikimedia.org/wikipedia/commons/0/0e/Jawaharlal_Nehru_1951-52_election_poster.jpg",

  "school": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Children_at_school%2C_India.jpg/960px-Children_at_school%2C_India.jpg",

  "friends": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Friendship_Holding_hands..jpg/960px-Friendship_Holding_hands..jpg",

  "cricket": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Cricket_bat_and_ball_at_Bishop%27s_Stortford_Cricket_Club%2C_Hertfordshire.jpg/960px-Cricket_bat_and_ball_at_Bishop%27s_Stortford_Cricket_Club%2C_Hertfordshire.jpg",

  "moon": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/960px-FullMoon2010.jpg",

  "owl": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Eurasian_eagle-owl_%2844088%29.jpg/960px-Eurasian_eagle-owl_%2844088%29.jpg",

  "tree": "https://upload.wikimedia.org/wikipedia/commons/0/07/Children_planting_plants_in_Seychelles.jpg",

  "bee": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1d/European_honey_bee_extracts_nectar.jpg/960px-European_honey_bee_extracts_nectar.jpg",

  "lightning": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Lightning_in_the_Sky_%289357443%29.jpg/960px-Lightning_in_the_Sky_%289357443%29.jpg",

};


const QUIZZES = {

  "UKG":[

const CLASS_ORDER=[
  "UKG",
  "1",
  "2",
  "3",
  "4",
  "5",
  "6",
  "7",
  "8"
];

const classDropdown =
  document.getElementById('classDropdown');

const classTrigger =
  document.getElementById('classTrigger');

const classTriggerText =
  document.getElementById('classTriggerText');

const classOptions =
  document.getElementById('classOptions');

let selectedClass='';


function classLabel(cls){

  return cls === 'UKG'
    ? 'UKG'
    : 'Class ' + cls;

}


CLASS_ORDER.forEach(cls=>{

  const li =
    document.createElement('li');

  li.textContent =
    classLabel(cls);

  li.dataset.value =
    cls;

  li.setAttribute(
    'role',
    'option'
  );


  li.addEventListener(
    'click',
    ()=>{

      selectedClass =
        cls;

      scheduleEarlyCheck();

      classTriggerText.textContent =
        classLabel(cls);

      preloadClassImages(cls);

      classOptions
        .querySelectorAll('li')
        .forEach(
          o =>
            o.classList.remove(
              'selected'
            )
        );

      li.classList.add(
        'selected'
      );

      closeClassDropdown();

    }
  );


  classOptions.appendChild(
    li
  );

});


function openClassDropdown(){

  classOptions.classList.remove(
    'hidden'
  );

  classDropdown.classList.add(
    'open'
  );

  classTrigger.setAttribute(
    'aria-expanded',
    'true'
  );

}


function closeClassDropdown(){

  classOptions.classList.add(
    'hidden'
  );

  classDropdown.classList.remove(
    'open'
  );

  classTrigger.setAttribute(
    'aria-expanded',
    'false'
  );

}


classTrigger.addEventListener(
  'click',
  ()=>{

    classOptions.classList.contains(
      'hidden'
    )
      ? openClassDropdown()
      : closeClassDropdown();

  }
);


document.addEventListener(
  'click',
  e=>{

    if(
      !classDropdown.contains(e.target)
    ){

      closeClassDropdown();

    }

  }
);

   ============================================================ */

function shuffleArray(arr){

  const a =
    arr.slice();


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;

}

/* ============================================================
   EARLY NAME CHECK
   ============================================================ */

/*
  Instagram-style: the slow duplicate-name check
  runs while the student is still typing their name
  and picking a class, instead of only after Start
  is tapped. By the time Start is tapped, the
  verdict is usually ready, so the quiz opens at
  once. The rule is unchanged: the quiz never
  starts on a duplicate name. If the student closes
  the tab, the in-flight check is aborted and
  nothing further is sent.
*/

let earlyCheckKey =
  '';

let earlyCheckResult =
  null;

let earlyCheckPromise =
  null;

let earlyCheckAbort =
  null;

let earlyCheckTimer =
  null;


function scheduleEarlyCheck(){

  const currentName =
    studentNameInput.value.trim();

  const currentCls =
    selectedClass;


  /*
    A verdict already ready for this exact
    name and class stays valid. This also stops
    a blur event from wiping a verdict right
    before the Start tap.
  */

  if(
    earlyCheckKey ===
    currentName + '|' + currentCls &&
    earlyCheckResult !==
    null
  ){

    return;

  }


  if(
    earlyCheckTimer
  ){

    clearTimeout(
      earlyCheckTimer
    );

    earlyCheckTimer =
      null;

  }


  /*
    New input invalidates any previous verdict.
  */

  earlyCheckKey =
    '';

  earlyCheckResult =
    null;

  if(
    earlyCheckAbort
  ){

    earlyCheckAbort.abort();

    earlyCheckAbort =
      null;

  }

  earlyCheckPromise =
    null;

  setupWarn.style.display =
    'none';


  if(
    !currentName ||
    !currentCls
  ){

    return;

  }


  if(
    API_URL.indexOf(
      'PASTE_YOUR'
    ) === 0
  ){

    return;

  }


  earlyCheckTimer =
    setTimeout(
      ()=>{

        const key =
          currentName + '|' + currentCls;

        earlyCheckKey =
          key;


        const controller =
          new AbortController();

        earlyCheckAbort =
          controller;


        earlyCheckPromise =
          fetch(
            API_URL,
            {
              method:'POST',

              headers:{
                'Content-Type':
                  'text/plain;charset=utf-8'
              },

              body:JSON.stringify({

                action:'start',

                studentName:currentName,

                className:currentCls,

                total:
                  (
                    QUIZZES[currentCls] ||
                    []
                  ).length

              }),

              signal:
                controller.signal
            }
          )
          .then(res => res.json())
          .then(
            data =>{

              if(
                earlyCheckKey !==
                key
              ){

                return null;

              }


              earlyCheckResult =
                data.error !==
                'duplicate';


              if(
                !earlyCheckResult &&
                quizCard.classList.contains(
                  'hidden'
                )
              ){

                setupWarn.textContent =
                  'A submission already exists for this name & class. Please check with your teacher if this is a mistake.';

                setupWarn.style.display =
                  'block';

              }


              return earlyCheckResult;

            }
          )
          .catch(
            ()=>{

              if(
                earlyCheckKey ===
                key
              ){

                earlyCheckResult =
                  null;

                earlyCheckPromise =
                  null;

              }


              return null;

            }
          );

      },
      700
    );

}


studentNameInput.addEventListener(
  'input',
  scheduleEarlyCheck
);


studentNameInput.addEventListener(
  'blur',
  scheduleEarlyCheck
);


window.addEventListener(
  'pagehide',
  ()=>{

    if(
      earlyCheckTimer
    ){

      clearTimeout(
        earlyCheckTimer
      );

    }


    if(
      earlyCheckAbort
    ){

      earlyCheckAbort.abort();

    }

  }
);

startBtn.addEventListener(
  'click',
  async ()=>{

    const name =
      studentNameInput.value.trim();

    const cls =
      selectedClass;


    if(!name || !cls){

      setupWarn.textContent =
        'Please enter your name and choose a class.';

      setupWarn.style.display =
        'block';

      return;

    }


    setupWarn.style.display =
      'none';


    /*
      Stop any check still scheduled from typing,
      so it cannot fire a second start call while
      the quiz is running.
    */

    if(
      earlyCheckTimer
    ){

      clearTimeout(
        earlyCheckTimer
      );

      earlyCheckTimer =
        null;

    }


    /*
      The name check usually already ran while
      the student was typing (see scheduleEarlyCheck).
      If its verdict is ready, Start is instant.
      If it is still running, wait only for the
      remainder. Otherwise run the blocking check
      exactly as before. Either way the quiz never
      starts on a duplicate name, and a verdict
      from the typing-time check means no second
      start call is sent.
    */

    const earlyKey =
      name + '|' + cls;

    let verdict =
      null;

    if(
      earlyCheckKey ===
      earlyKey
    ){

      if(
        earlyCheckResult !==
        null
      ){

        verdict =
          earlyCheckResult;

      }else if(
        earlyCheckPromise
      ){

        verdict =
          await earlyCheckPromise;

      }

    }


    if(
      verdict ===
      null
    ){

      startBtn.disabled =
        true;


      const originalBtnText =
        startBtn.textContent;


      startBtn.textContent =
        'Checking…';


      try{

        if(
          API_URL.indexOf(
            'PASTE_YOUR'
          ) !== 0
        ){

          const res =
            await fetch(
              API_URL,
              {
                method:'POST',

                headers:{
                  'Content-Type':
                    'text/plain;charset=utf-8'
                },

                body:JSON.stringify({

                  action:'start',

                  studentName:name,

                  className:cls,

                  total:
                    (
                      QUIZZES[cls] ||
                      []
                    ).length

                })
              }
            );


          const data =
            await res.json();


          if(
            data.error ===
            'duplicate'
          ){

            verdict =
              false;

          }

        }

      }catch(err){

        /*
         If the start request fails because
         of a temporary network problem,
         allow the student to continue.
        */

      }


      startBtn.disabled =
        false;

      startBtn.textContent =
        originalBtnText;

    }


    if(
      verdict ===
      false
    ){

      setupWarn.textContent =
        'A submission already exists for this name & class. Please check with your teacher if this is a mistake.';

      setupWarn.style.display =
        'block';

      return;

    }


    currentClass =
      cls;

    currentStudentName =
      name;

    currentQuestions =
      QUIZZES[cls];

    preloadClassImages(cls);

    answers =
      new Array(
        currentQuestions.length
      ).fill(null);

    currentQIndex =
      0;

    tabSwitchCount =
      0;


    setupCard.classList.add(
      'hidden'
    );

    quizCard.classList.remove(
      'hidden'
    );


    renderQuestion(
      name,
      cls,
      0
    );

  }
);


/* ============================================================
   QUESTION PHOTOS
   ============================================================ */

function buildPhoto(
  item,
  small
){

  if(
    item.pic &&
    !small
  ){

    const card =
      document.createElement('div');

    card.className =
      'q-pic';

    const text =
      document.createElement('span');

    text.textContent =
      item.pic;

    card.appendChild(text);

    return card;

  }


  const fig =
    document.createElement('div');

  fig.className =
    'q-photo is-loading';


  const url =
    QUESTION_IMAGES[item.img];


  const showEmoji =
    ()=>{

      fig.classList.remove(
        'is-loading'
      );

      fig.innerHTML =
        '<span class="photo-emoji">' +
        (item.e || '\uD83C\uDF0D') +
        '</span>';

    };


  if(!url){

    showEmoji();

    return fig;

  }


  const img =
    document.createElement('img');

  /*
   The alt text is deliberately vague so
   that it never gives the answer away.
  */

  img.alt =
    small
      ? ''
      : 'Picture clue for this question';

  img.decoding =
    'async';

  img.referrerPolicy =
    'no-referrer';


  img.addEventListener(
    'load',
    ()=>{

      fig.classList.remove(
        'is-loading'
      );

    }
  );


  img.addEventListener(
    'error',
    showEmoji
  );


  img.className =
    'photo-main';


  const bg =
    document.createElement('img');

  bg.className =
    'photo-bg';

  bg.alt =
    '';

  bg.setAttribute(
    'aria-hidden',
    'true'
  );

  bg.decoding =
    'async';

  bg.referrerPolicy =
    'no-referrer';

  bg.src =
    url;


  img.src =
    url;


  fig.appendChild(bg);

  fig.appendChild(img);

  return fig;

}


function preloadClassImages(cls){

  (QUIZZES[cls] || []).forEach(
    item=>{

      const url =
        QUESTION_IMAGES[item.img];


      if(url){

        const pre =
          new Image();

        pre.src =
          url;

      }

    }
  );

}


function fitPuzzleCard(card){

  const text =
    card.querySelector('span');

  const wantLines =
    text.textContent.split('\n').length;

  let rem = 1.65;


  while(rem > 1.05){

    card.style.fontSize =
      rem + 'rem';

    const linePx =
      parseFloat(
        getComputedStyle(text).lineHeight
      );

    const lines =
      Math.round(
        text.getBoundingClientRect().height /
        linePx
      );


    if(lines <= wantLines){

      return;

    }


    rem -= 0.05;

  }

}


/* ============================================================
   RENDER QUESTION
   ============================================================ */

function renderQuestion(
  name,
  cls,
  qi
){

  quizWho.textContent =
    name +
    ' — ' +
    classLabel(cls);


  document
    .getElementById('headerSub')
    .textContent =
      classLabel(cls) +
      ' — Children\'s Day';


  quizProg.textContent =
    'Question ' +
    (qi+1) +
    ' of ' +
    currentQuestions.length;


  quizWarn.style.display =
    'none';


  const item =
    currentQuestions[qi];


  const displayOptions =
    shuffleArray(
      item.o.map(
        (text,idx)=>({
          text:text,
          idx:idx
        })
      )
    );


  questionsContainer.innerHTML =
    '';


  const block =
    document.createElement('div');

  block.className =
    'q-block';


  block.appendChild(
    buildPhoto(
      item,
      false
    )
  );


  const qLine =
    document.createElement('div');


  qLine.innerHTML =
    '<span class="q-num">' +
    (qi+1) +
    '</span>' +
    '<span class="q-text">' +
    item.q +
    '</span>';


  block.appendChild(
    qLine
  );


  const optsWrap =
    document.createElement('div');

  optsWrap.className =
    'options';


  displayOptions.forEach(
    opt=>{

      const label =
        document.createElement(
          'label'
        );

      label.className =
        'opt';


      label.innerHTML =
        '<input type="radio" name="q' +
        qi +
        '" value="' +
        opt.idx +
        '">' +
        '<span class="opt-text">' +
        opt.text +
        '</span>';


      if(
        answers[qi] ===
        opt.idx
      ){

        label.classList.add(
          'selected'
        );

        label
          .querySelector('input')
          .checked=true;

      }


      const radio =
        label.querySelector(
          'input'
        );


      radio.addEventListener(
        'change',
        ()=>{

          answers[qi] =
            opt.idx;


          optsWrap
            .querySelectorAll(
              '.opt'
            )
            .forEach(
              o =>
                o.classList.remove(
                  'selected'
                )
            );


          label.classList.add(
            'selected'
          );

        }
      );


      optsWrap.appendChild(
        label
      );

    }
  );


  block.appendChild(
    optsWrap
  );


  questionsContainer.appendChild(
    block
  );


  const puzzleCard =
    block.querySelector('.q-pic');

  if(puzzleCard){

    fitPuzzleCard(puzzleCard);

  }


  submitBtn.textContent =
    (
      qi ===
      currentQuestions.length-1
    )
      ? 'Turn In Paper'
      : 'Next Question';


  startTimer();

}


/* ============================================================
   TIMER
   ============================================================ */

function startTimer(){

  clearInterval(
    timerInterval
  );


  const seconds =
    getQuestionSeconds(
      currentClass
    );


  let timeLeft =
    seconds;


  const bar =
    document.getElementById(
      'timerBar'
    );


  bar.classList.remove(
    'urgent'
  );


  bar.style.width =
    '100%';


  timerInterval =
    setInterval(
      ()=>{

        timeLeft--;


        const pct =
          Math.max(
            0,
            (
              timeLeft /
              seconds
            ) * 100
          );


        bar.style.width =
          pct + '%';


        if(
          timeLeft <= 5
        ){

          bar.classList.add(
            'urgent'
          );

        }


        if(
          timeLeft <= 0
        ){

          clearInterval(
            timerInterval
          );

          advanceQuestion();

        }

      },
      1000
    );

}


/* ============================================================
   ADVANCE QUESTION
   ============================================================ */

function advanceQuestion(){

  clearInterval(
    timerInterval
  );


  if(
    currentQIndex <
    currentQuestions.length-1
  ){

    currentQIndex++;


    renderQuestion(
      currentStudentName,
      currentClass,
      currentQIndex
    );

  }else{

    showResults();

  }

}


/* ============================================================
   NEXT / SUBMIT BUTTON
   ============================================================ */

submitBtn.addEventListener(
  'click',
  ()=>{
    advanceQuestion();
  }
);


/* ============================================================
   SHOW RESULTS
   ============================================================ */

function showResults(){

  let score=0;

  let unattempted=0;


  const reviewContainer =
    document.getElementById(
      'reviewContainer'
    );


  reviewContainer.innerHTML =
    '';


  currentQuestions.forEach(
    (item,qi)=>{

      const isCorrect =
        answers[qi] === item.a;


      if(isCorrect){

        score++;

      }


      if(
        answers[qi] === null
      ){

        unattempted++;

      }


      const yourAnswerText =
        answers[qi] === null
          ? 'No answer (time ran out)'
          : item.o[answers[qi]];


      const block =
        document.createElement(
          'div'
        );


      block.className =
        'q-block ' +
        (
          isCorrect
            ? 'correct'
            : 'wrong'
        );


      block.innerHTML =

        '<span class="q-num">' +
        (qi+1) +
        '</span>' +

        '<span class="q-text">' +
        item.q +
        '</span>' +

        '<span class="tag ' +
        (
          isCorrect
            ? 'correct'
            : 'wrong'
        ) +
        '">' +
        (
          isCorrect
            ? 'Correct'
            : 'Incorrect'
        ) +
        '</span>' +

        '<div class="your-ans">' +
        'Your answer: ' +
        yourAnswerText +
        '</div>' +

        (
          isCorrect
            ? ''
            :
            '<div class="correct-ans">' +
            'Correct answer: ' +
            item.o[item.a] +
            '</div>'
        );


      block.insertBefore(
        buildPhoto(
          item,
          true
        ),
        block.firstChild
      );


      if(item.pic){

        const picLine =
          document.createElement('div');

        picLine.className =
          'pic-line';

        picLine.textContent =
          item.pic;

        block
          .querySelector('.your-ans')
          .before(picLine);

      }


      reviewContainer.appendChild(
        block
      );

    }
  );


  document
    .getElementById('scoreNum')
    .textContent =
      score +
      '/' +
      currentQuestions.length;


  const pct =
    Math.round(
      (
        score /
        currentQuestions.length
      ) * 100
    );


  let msg;

  let sub;


  if(pct === 100){

    msg =
      'Perfect Score!';

    sub =
      'Every answer correct — well done.';

  }

  else if(pct >= 70){

    msg =
      'Great Job!';

    sub =
      'Solid work — a couple to review.';

  }

  else if(pct >= 40){

    msg =
      'Good Try!';

    sub =
      'Keep practicing — you are getting there.';

  }

  else{

    msg =
      'Keep Practicing';

    sub =
      'Review the topics below and keep learning.';

  }


  document
    .getElementById('resultMsg')
    .textContent =
      msg;


  document
    .getElementById('resultSub')
    .textContent =
      sub;


  quizCard.classList.add(
    'hidden'
  );


  resultsCard.classList.remove(
    'hidden'
  );


  window.scrollTo({
    top:0,
    behavior:'smooth'
  });


  saveScore(
    score,
    currentQuestions.length,
    unattempted
  );

}


/* ============================================================
   SAVE RESULT TO GOOGLE SHEETS
   ============================================================ */

async function saveScore(
  score,
  total,
  unattempted
){

  const statusEl =
    document.getElementById(
      'saveStatus'
    );


  statusEl.textContent =
    'Saving your result…';


  statusEl.className =
    'save-status pending';


  try{

    if(
      API_URL.indexOf(
        'PASTE_YOUR'
      ) === 0
    ){

      throw new Error(
        'API_URL not configured yet'
      );

    }


    const res =
      await fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:JSON.stringify({

            action:'result',

            studentName:
              currentStudentName,

            className:
              currentClass,

            score:
              score,

            total:
              total,

            tabSwitches:
              tabSwitchCount,

            unattempted:
              unattempted

          })
        }
      );


    const data =
      await res.json();


    if(
      data.error ===
      'duplicate'
    ){

      statusEl.textContent =
        'This name already has a saved result for this class — not saved again.';

      statusEl.className =
        'save-status fail';

      return;

    }


    if(
      !res.ok ||
      !data.ok
    ){

      throw new Error(
        'Server rejected the submission'
      );

    }


    statusEl.textContent =
      'Result saved.';

    statusEl.className =
      'save-status ok';


  }catch(err){

    statusEl.textContent =
      'Could not save your result — please tell your teacher.';

    statusEl.className =
      'save-status fail';

  }

}


/* ============================================================
   RETRY
   ============================================================ */

retryBtn.addEventListener(
  'click',
  ()=>{

    clearInterval(
      timerInterval
    );


    currentQIndex =
      0;

    tabSwitchCount =
      0;


    resultsCard.classList.add(
      'hidden'
    );


    setupCard.classList.remove(
      'hidden'
    );


    studentNameInput.value =
      '';


    selectedClass =
      '';


    classTriggerText.textContent =
      'Choose a class';


    classOptions
      .querySelectorAll('li')
      .forEach(
        o =>
          o.classList.remove(
            'selected'
          )
      );


    document
      .getElementById('headerSub')
      .textContent =
      '';


    window.scrollTo({
      top:0,
      behavior:'smooth'
    });

  }
);


/* ============================================================
   WARM-UP
   ============================================================ */

/*
  Apps Script web apps are slow on their first
  call after idle (cold start), which is a big
  part of the 3-4 second name check. This silent
  request fires while the student is still picking
  a class and typing their name, so the script is
  already warm when Start is tapped and the real
  check returns faster. The response is ignored,
  and this request writes nothing. The Start check
  itself is unchanged and still blocks the quiz on
  a duplicate name.
*/

if(
  API_URL.indexOf(
    'PASTE_YOUR'
  ) !== 0
){

  fetch(
    API_URL,
    {
      method:'GET',
      mode:'no-cors',
      cache:'no-store'
    }
  ).catch(
    () => {}
  );

}
