<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Saturday Quiz — Vardhman Convent School, Moonak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #0B1F4D;
    --board-2: #122a5e;
    --chalk: #F5F1E6;
    --paper: #FBF8F0;
    --line: #D8CFB8;
    --mustard: #E8A33D;
    --red: #C1443C;
    --blue: #0B1F4D;
    --sage: #2E7D46;
    --ink: #2B2620;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: var(--board);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.03) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.025) 0%, transparent 40%);
    color: var(--ink);
    min-height:100vh;
  }
  .theme-badge{
    display:inline-block;
    background: var(--mustard);
    color: var(--board);
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:0.8rem;
    padding:4px 14px;
    border-radius:20px;
    letter-spacing:0.03em;
    margin-top:8px;
  }
  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 18px 60px;
  }
  header{
    text-align:center;
    margin-bottom: 26px;
  }
  header .chalk-line{
    width:64px; height:3px; background: var(--mustard);
    margin: 0 auto 14px; border-radius:2px;
    opacity:0.8;
  }
  h1{
    font-family:'Kalam', cursive;
    color: var(--chalk);
    font-size: 2.1rem;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }
  header .school-name{
    color: var(--chalk);
    margin:0 0 10px;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:0.02em;
  }
  header .school-phone{
    color: var(--sage);
    margin:-6px 0 10px;
    font-size:0.9rem;
    font-weight:700;
    letter-spacing:0.02em;
  }
  header p{
    color: var(--sage);
    margin:0;
    font-size:0.95rem;
    font-weight:600;
  }

  /* Setup card */
  .card{
    background: var(--paper);
    border-radius: 14px;
    padding: 26px 24px;
    box-shadow: 0 14px 34px rgba(0,0,0,0.28);
  }
  .field{
    margin-bottom:18px;
  }
  label{
    display:block;
    font-weight:800;
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color: var(--board);
    margin-bottom:8px;
  }
  input[type="text"]{
    width:100%;
    padding:12px 14px;
    border-radius:9px;
    border:2px solid var(--line);
    font-family:'Nunito',sans-serif;
    font-size:1rem;
    background:#fff;
    color: var(--ink);
  }

  /* Custom class picker — replaces native <select> so the open dropdown can be
     themed too. Mobile browsers render native <select> options as an
     OS-level sheet that CSS cannot touch, so this is a plain div/button/list
     built and styled entirely by us. */
  .custom-select{ position:relative; }
  .custom-select-trigger{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px;
    border-radius:9px;
    border:2px solid var(--board);
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:1rem;
    background:var(--paper);
    color: var(--board);
    cursor:pointer;
    text-align:left;
  }
  .custom-select-trigger:focus{
    outline:none;
    border-color: var(--blue);
  }
  .custom-select-trigger .chevron{
    flex-shrink:0;
    margin-left:10px;
    transition: transform 0.15s ease;
  }
  .custom-select.open .custom-select-trigger .chevron{
    transform: rotate(180deg);
  }
  .custom-select-options{
    list-style:none;
    margin:6px 0 0;
    padding:6px;
    position:absolute;
    top:100%; left:0; right:0;
    z-index:20;
    background: var(--paper);
    border:2px solid var(--board);
    border-radius:11px;
    box-shadow: 0 12px 26px rgba(0,0,0,0.22);
    max-height: 260px;
    overflow-y:auto;
  }
  .custom-select-options li{
    padding:11px 12px;
    border-radius:7px;
    font-weight:700;
    color: var(--ink);
    cursor:pointer;
  }
  .custom-select-options li:hover,
  .custom-select-options li.active{
    background: var(--mustard);
    color: var(--board);
  }
  .custom-select-options li.selected{
    color: var(--blue);
  }
  .custom-select-options li.selected::after{
    content:"✓";
    float:right;
    font-weight:800;
  }
  input[type="text"]:focus, select:focus{
    outline: none;
    border-color: var(--blue);
  }
  .btn{
    display:inline-block;
    background: var(--board);
    color: var(--chalk);
    font-family:'Kalam',cursive;
    font-size:1.15rem;
    border:none;
    padding:13px 28px;
    border-radius:9px;
    cursor:pointer;
    box-shadow: 0 6px 0 #071433;
    transition: transform 0.08s ease;
  }
  .btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 #071433;
  }
  .btn:disabled{
    opacity:0.45;
    cursor:not-allowed;
    box-shadow: 0 6px 0 #071433;
  }
  .btn-row{ text-align:center; margin-top:22px; }
  .btn.secondary{
    background: var(--paper);
    color: var(--board);
    border:2px solid var(--board);
    box-shadow:none;
  }

  /* Quiz paper */
  .quiz-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 18px;
    padding-bottom:12px;
    border-bottom: 2px dashed var(--line);
    flex-wrap:wrap; gap:8px;
  }
  .quiz-header .who{
    font-weight:800; color: var(--board);
  }
  .quiz-header .prog{
    font-size:0.85rem; color:#7a7362; font-weight:700;
  }
  .timer-wrap{
    height:8px;
    width:100%;
    background: var(--line);
    border-radius:6px;
    overflow:hidden;
    margin: 0 0 18px;
  }
  .timer-bar{
    height:100%;
    width:100%;
    background: var(--sage);
    transition: width 1s linear, background-color 0.3s;
  }
  .timer-bar.urgent{ background: var(--red); }
  #questionsContainer{
    user-select:none;
    -webkit-user-select:none;
  }
  .q-block{
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .q-block:last-of-type{ border-bottom:none; }
  .q-num{
    display:inline-flex;
    align-items:center; justify-content:center;
    width:26px; height:26px;
    background: var(--mustard);
    color: var(--board);
    font-weight:800;
    border-radius:50%;
    font-size:0.85rem;
    margin-right:8px;
  }
  .q-text{
    font-weight:700;
    font-size:1.02rem;
    display:inline;
  }
  .options{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    border:2px solid var(--line);
    cursor:pointer;
    transition: border-color 0.12s, background 0.12s;
  }
  .opt:hover{ border-color: var(--blue); }
  .opt input{ accent-color: var(--board); width:16px; height:16px; }
  .opt.selected{
    border-color: var(--blue);
    background: #EEF3F8;
  }
  .opt-text{ font-weight:600; font-size:0.96rem; }

  .warn{
    color: var(--red);
    font-weight:700;
    font-size:0.85rem;
    text-align:center;
    margin-top:10px;
    display:none;
  }

  /* Results / report card */
  .results{
    text-align:center;
  }
  .stamp{
    width:150px; height:150px;
    margin: 6px auto 18px;
    border-radius:50%;
    border: 5px solid var(--red);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform: rotate(-6deg);
    color: var(--red);
    font-family:'Kalam',cursive;
  }
  .stamp .score-num{
    font-size:2.2rem;
    font-weight:700;
    line-height:1;
  }
  .stamp .score-label{
    font-size:0.75rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin-top:2px;
  }
  .result-msg{
    font-family:'Kalam',cursive;
    font-size:1.3rem;
    color: var(--board);
    margin-bottom: 6px;
  }
  .result-sub{
    color:#7a7362;
    font-weight:600;
    margin-bottom:22px;
    font-size:0.92rem;
  }
  .save-status{
    font-size:0.82rem;
    font-weight:700;
    margin-bottom:22px;
  }
  .save-status.ok{ color:#2E7D46; }
  .save-status.fail{ color: var(--red); }
  .save-status.pending{ color:#7a7362; }
  .review{
    text-align:left;
    margin-top: 10px;
  }
  .review .q-block .your-ans, .review .q-block .correct-ans{
    font-size:0.88rem;
    font-weight:700;
    margin-top:6px;
  }
  .review .correct .your-ans{ color: #2E7D46; }
  .review .wrong .your-ans{ color: var(--red); }
  .review .wrong .correct-ans{ color: var(--blue); }
  .tag{
    display:inline-block;
    font-size:0.7rem;
    font-weight:800;
    padding:2px 8px;
    border-radius:20px;
    margin-left:8px;
    vertical-align:middle;
    text-transform:uppercase;
  }
  .tag.correct{ background:#E1F3E5; color:#2E7D46; }
  .tag.wrong{ background:#FBE4E2; color: var(--red); }

  .hidden{ display:none; }

  footer{
    text-align:center;
    color: rgba(245,241,230,0.5);
    font-size:0.78rem;
    margin-top: 26px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <p class="school-name">Vardhman Convent School, Moonak</p>

  </header>

  <!-- SETUP -->
  <div class="card" id="setupCard">
    <div class="field">
      <label for="studentName">Student name</label>
      <input type="text" id="studentName" placeholder="Type your name" autocomplete="off">
    </div>
    <div class="field">
      <label id="classLabelText">Select your class</label>
      <div class="custom-select" id="classDropdown">
        <button type="button" class="custom-select-trigger" id="classTrigger" aria-haspopup="listbox" aria-expanded="false">
          <span id="classTriggerText">Choose a class</span>
          <svg class="chevron" width="14" height="9" viewBox="0 0 14 9"><path d="M1 1L7 7L13 1" stroke="#0B1F4D" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <ul class="custom-select-options hidden" id="classOptions" role="listbox"></ul>
      </div>
    </div>
    <div class="warn" id="setupWarn">Please enter your name and pick a class.</div>
    <div class="btn-row">
      <button class="btn" id="startBtn">Start Quiz</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="card hidden" id="quizCard">
    <div class="quiz-header">
      <div class="who" id="quizWho"></div>
      <div class="prog" id="quizProg"></div>
    </div>
    <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
    <div id="questionsContainer"></div>
    <div class="warn" id="quizWarn">Please answer all questions before submitting.</div>
    <div class="btn-row">
      <button class="btn" id="submitBtn">Turn In Paper</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div class="card hidden" id="resultsCard">
    <div class="results">
      <div class="stamp">
        <div class="score-num" id="scoreNum">0/10</div>
        <div class="score-label">Marks</div>
      </div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="save-status" id="saveStatus"></div>
    </div>
    <div class="review" id="reviewContainer"></div>
    <div class="btn-row">
      <button class="btn secondary" id="retryBtn">Try Another Class</button>
    </div>
  </div>

</div>

    {q:"In chess, when the king is under direct attack but can still escape, it is called?", o:["Check","Checkmate","Stalemate"], a:0},
    {q:"Which Indian wrestler became the first Indian to win two individual Olympic medals (bronze 2008, silver 2012)?", o:["Sushil Kumar","Yogeshwar Dutt","Bajrang Punia"], a:0},
    {q:"What is the approximate standard distance of a marathon race?", o:["42.195 km","21 km","100 km"], a:0},
    {q:"What is the highest sporting honour given by the Government of India?", o:["Major Dhyan Chand Khel Ratna Award","Arjuna Award","Padma Shri"], a:0}
  ]
};

const CLASS_ORDER = ["UKG","1","2","3","4","5","6","7","8"];

const classDropdown = document.getElementById('classDropdown');
const classTrigger = document.getElementById('classTrigger');
const classTriggerText = document.getElementById('classTriggerText');
const classOptions = document.getElementById('classOptions');
let selectedClass = '';

function classLabel(cls){
  return cls === 'UKG' ? 'UKG' : 'Class ' + cls;
}

CLASS_ORDER.forEach(cls=>{
  const li = document.createElement('li');
  li.textContent = classLabel(cls);
  li.dataset.value = cls;
  li.setAttribute('role', 'option');
  li.addEventListener('click', ()=>{
    selectedClass = cls;
    classTriggerText.textContent = classLabel(cls);
    classOptions.querySelectorAll('li').forEach(o=>o.classList.remove('selected'));
    li.classList.add('selected');
    closeClassDropdown();
  });
  classOptions.appendChild(li);
});

function openClassDropdown(){
  classOptions.classList.remove('hidden');
  classDropdown.classList.add('open');
  classTrigger.setAttribute('aria-expanded', 'true');
}
function closeClassDropdown(){
  classOptions.classList.add('hidden');
  classDropdown.classList.remove('open');
  classTrigger.setAttribute('aria-expanded', 'false');
}
classTrigger.addEventListener('click', ()=>{
  classOptions.classList.contains('hidden') ? openClassDropdown() : closeClassDropdown();
});
document.addEventListener('click', (e)=>{
  if(!classDropdown.contains(e.target)) closeClassDropdown();
});

const setupCard = document.getElementById('setupCard');
const quizCard = document.getElementById('quizCard');
const resultsCard = document.getElementById('resultsCard');
const studentNameInput = document.getElementById('studentName');
const startBtn = document.getElementById('startBtn');
const setupWarn = document.getElementById('setupWarn');
const questionsContainer = document.getElementById('questionsContainer');
const quizWho = document.getElementById('quizWho');
const quizProg = document.getElementById('quizProg');
const submitBtn = document.getElementById('submitBtn');
const quizWarn = document.getElementById('quizWarn');
const retryBtn = document.getElementById('retryBtn');

let currentClass = null;
let currentQuestions = [];
let answers = [];
let currentStudentName = '';
let currentQIndex = 0;
let tabSwitchCount = 0;
let timerInterval = null;
const QUESTION_SECONDS = 15;
const QUESTION_SECONDS_BY_CLASS = { "UKG": 20, "1": 20 };

function getQuestionSeconds(cls){
  return QUESTION_SECONDS_BY_CLASS[cls] || QUESTION_SECONDS;
}

// Silently logs when the student leaves this tab/app mid-quiz (switches to
// another app, tab, or window) and comes back. Not shown to the student —
// only reported to the teacher alongside the score.
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(quizCard && !quizCard.classList.contains('hidden')){
    tabSwitchCount++;
  }
});

questionsContainer.addEventListener('contextmenu', (e)=>{ e.preventDefault(); });
questionsContainer.addEventListener('copy', (e)=>{ e.preventDefault(); });

function normalizeKey(name, cls){
  return (cls + '_' + name).trim().toLowerCase().replace(/\s+/g,' ');
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

startBtn.addEventListener('click', async ()=>{
  const name = studentNameInput.value.trim();
  const cls = selectedClass;
  if(!name || !cls){
    setupWarn.textContent = 'Please enter your name and choose a class.';
    setupWarn.style.display = 'block';
    return;
  }
  setupWarn.style.display = 'none';

  const key = normalizeKey(name, cls);
  if(localStorage.getItem('quizDone_'+key)){
    setupWarn.textContent = 'This name has already submitted the quiz for this class on this device.';
    setupWarn.style.display = 'block';
    return;
  }

  startBtn.disabled = true;
  const originalBtnText = startBtn.textContent;
  startBtn.textContent = 'Checking…';
  try{
    if(API_URL.indexOf('PASTE_YOUR') !== 0){
      const checkUrl = API_URL + '?name=' + encodeURIComponent(name) + '&className=' + encodeURIComponent(cls);
      const res = await fetch(checkUrl);
      const data = await res.json();
      if(data.ok && data.exists){
        setupWarn.textContent = 'A submission already exists for this name & class. Please check with your teacher if this is a mistake.';
        setupWarn.style.display = 'block';
        startBtn.disabled = false;
        startBtn.textContent = originalBtnText;
        return;
      }
    }
  }catch(err){
    // If the check itself fails (e.g. offline), let the student proceed —
    // the server still blocks true duplicates when the result is submitted.
  }
  startBtn.disabled = false;
  startBtn.textContent = originalBtnText;

  currentClass = cls;
  currentStudentName = name;
  currentQuestions = QUIZZES[cls];
  answers = new Array(currentQuestions.length).fill(null);
  currentQIndex = 0;
  tabSwitchCount = 0;
  setupCard.classList.add('hidden');
  quizCard.classList.remove('hidden');
  renderQuestion(name, cls, 0);
});

function renderQuestion(name, cls, qi){
  quizWho.textContent = name + ' — ' + classLabel(cls);
  document.getElementById('headerSub').textContent = classLabel(cls) + ' — Sports & Games';
  quizProg.textContent = 'Question ' + (qi+1) + ' of ' + currentQuestions.length;
  quizWarn.style.display = 'none';

  const item = currentQuestions[qi];
  const displayOptions = item.o.map((text, idx)=>({text, idx}));

  questionsContainer.innerHTML = '';
  const block = document.createElement('div');
  block.className = 'q-block';

  const qLine = document.createElement('div');
  qLine.innerHTML = '<span class="q-num">'+(qi+1)+'</span><span class="q-text">'+item.q+'</span>';
  block.appendChild(qLine);

  const optsWrap = document.createElement('div');
  optsWrap.className = 'options';
  displayOptions.forEach((opt)=>{
    const label = document.createElement('label');
    label.className = 'opt';
    label.innerHTML = '<input type="radio" name="q'+qi+'" value="'+opt.idx+'"><span class="opt-text">'+opt.text+'</span>';
    if(answers[qi] === opt.idx) { label.classList.add('selected'); label.querySelector('input').checked = true; }
    const radio = label.querySelector('input');
    radio.addEventListener('change', ()=>{
      answers[qi] = opt.idx;
      optsWrap.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
      label.classList.add('selected');
    });
    optsWrap.appendChild(label);
  });
  block.appendChild(optsWrap);
  questionsContainer.appendChild(block);

  submitBtn.textContent = (qi === currentQuestions.length - 1) ? 'Turn In Paper' : 'Next Question';

  startTimer();
}

function startTimer(){
  clearInterval(timerInterval);
  const seconds = getQuestionSeconds(currentClass);
  let timeLeft = seconds;
  const bar = document.getElementById('timerBar');
  bar.classList.remove('urgent');
  bar.style.width = '100%';

  timerInterval = setInterval(()=>{
    timeLeft--;
    const pct = Math.max(0, (timeLeft / seconds) * 100);
    bar.style.width = pct + '%';
    if(timeLeft <= 5) bar.classList.add('urgent');
    if(timeLeft <= 0){
      clearInterval(timerInterval);
      advanceQuestion();
    }
  }, 1000);
}

function advanceQuestion(){
  clearInterval(timerInterval);
  if(currentQIndex < currentQuestions.length - 1){
    currentQIndex++;
    renderQuestion(currentStudentName, currentClass, currentQIndex);
  } else {
    showResults();
  }
}

submitBtn.addEventListener('click', ()=>{
  advanceQuestion();
});

function showResults(){
  let score = 0;
  let unattempted = 0;
  const reviewContainer = document.getElementById('reviewContainer');
  reviewContainer.innerHTML = '';
  currentQuestions.forEach((item, qi)=>{
    const isCorrect = answers[qi] === item.a;
    if(isCorrect) score++;
    if(answers[qi] === null) unattempted++;
    const yourAnswerText = answers[qi] === null ? 'No answer (time ran out)' : item.o[answers[qi]];
    const block = document.createElement('div');
    block.className = 'q-block ' + (isCorrect ? 'correct' : 'wrong');
    block.innerHTML =
      '<span class="q-num">'+(qi+1)+'</span><span class="q-text">'+item.q+'</span>' +
      '<span class="tag '+(isCorrect?'correct':'wrong')+'">'+(isCorrect?'Correct':'Incorrect')+'</span>' +
      '<div class="your-ans">Your answer: '+yourAnswerText+'</div>' +
      (isCorrect ? '' : '<div class="correct-ans">Correct answer: '+item.o[item.a]+'</div>');
    reviewContainer.appendChild(block);
  });

  document.getElementById('scoreNum').textContent = score + '/' + currentQuestions.length;
  const pct = Math.round((score/currentQuestions.length)*100);
  let msg, sub;
  if(pct === 100){ msg = 'Perfect Score!'; sub = 'Every answer correct — well done.'; }
  else if(pct >= 70){ msg = 'Great Job!'; sub = 'Solid work — a couple to review.'; }
  else if(pct >= 40){ msg = 'Good Try!'; sub = 'Keep practicing — you are getting there.'; }
  else { msg = 'Keep Practicing'; sub = 'Review the topics below and try again.'; }
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultSub').textContent = sub;

  quizCard.classList.add('hidden');
  resultsCard.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'smooth'});

  saveScore(score, currentQuestions.length, unattempted);
}

// Sends the result to the teacher's backend. Shown to the student so they know
// whether it actually reached the teacher, not just that grading finished locally.
async function saveScore(score, total, unattempted){
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = 'Saving your result…';
  statusEl.className = 'save-status pending';
  try{
    if(API_URL.indexOf('PASTE_YOUR') === 0){
      throw new Error('API_URL not configured yet');
    }
    // Apps Script web apps don't send CORS headers for JSON POSTs from the browser,
    // so we send as text/plain (a "simple request" that skips the CORS preflight).
    // The script on the other end still parses it as JSON.
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        studentName: currentStudentName,
        className: currentClass,
        score: score,
        total: total,
        tabSwitches: tabSwitchCount,
        unattempted: unattempted
      })
    });
    const data = await res.json();
    if(data.error === 'duplicate'){
      statusEl.textContent = 'This name already has a saved result for this class — not saved again.';
      statusEl.className = 'save-status fail';
      localStorage.setItem('quizDone_'+normalizeKey(currentStudentName, currentClass), '1');
      return;
    }
    if(!res.ok || !data.ok) throw new Error('Server rejected the submission');
    localStorage.setItem('quizDone_'+normalizeKey(currentStudentName, currentClass), '1');
    statusEl.textContent = 'Result saved.';
    statusEl.className = 'save-status ok';
  }catch(err){
    statusEl.textContent = 'Could not save your result — please tell your teacher.';
    statusEl.className = 'save-status fail';
  }
}

retryBtn.addEventListener('click', ()=>{
  clearInterval(timerInterval);
  currentQIndex = 0;
  tabSwitchCount = 0;
  resultsCard.classList.add('hidden');
  setupCard.classList.remove('hidden');
  studentNameInput.value = '';
  selectedClass = '';
  classTriggerText.textContent = 'Choose a class';
  classOptions.querySelectorAll('li').forEach(o=>o.classList.remove('selected'));
  document.getElementById('headerSub').textContent = '';
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
